[project]
name = "cyproto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "falib @ git+http://oauth2:***REMOVED***@YOUR_GITLAB_HOST:7002/rex/falib.git@main",
    "ape-vyper>=0.8.9",
    "eth-ape>=0.8.37",
    "loguru>=0.7.3",
    "tortoise-orm>=0.21.0",
    "aerich>=0.9.2",
    "vyper>=0.4.0",
    "web3>=7.13.0",
    "uvicorn>=0.38.0",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.20",
    "ape-hardhat>=0.8.5",
    "hypothesis>=6.151.9",
]

[project.optional-dependencies]
# 数据库驱动 - 根据需要选择安装
postgresql = ["asyncpg>=0.29.0", "psycopg2-binary>=2.9.0"]
mysql = ["aiomysql>=0.2.0", "pymysql>=1.1.0"]
sqlite = ["aiosqlite>=0.19.0"]
# 安装所有数据库驱动
all-db = ["asyncpg>=0.29.0", "psycopg2-binary>=2.9.0", "aiomysql>=0.2.0", "pymysql>=1.1.0", "aiosqlite>=0.19.0"]

[tool.pytest.ini_options]
filterwarnings = [
    # 第三方库 Pydantic V1 兼容性警告 (falib, schemas 等)
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    # Tortoise ORM 废弃参数警告 (pk → primary_key, index → db_index)
    "ignore:`pk` is deprecated:DeprecationWarning",
    "ignore:`index` is deprecated:DeprecationWarning",
    # Mock 对象创建时产生的未等待协程警告 (测试 Mock 产物，非真实问题)
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # websockets 库废弃 legacy 模块警告 (第三方依赖，非项目代码)
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    # PyJWT 开发环境密钥长度警告 (dev 配置密钥较短，非生产问题)
    "ignore:.*HMAC key.*below the minimum recommended length.*:jwt.warnings.InsecureKeyLengthWarning",
    # Starlette HTTP 状态码废弃警告 (第三方库内部，非项目代码)
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
]

[tool.aerich]
tortoise_orm = "src.shared.aerich_redirect.TORTOISE_ORM"
location = "./migrations"
src_folder = "./app/backend"


[tool.ruff]
target-version = "py313"
exclude = [
    ".venv",
    ".build",
    "migrations",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
ignore = [
    "E501", 
    "PLR0913",
    "PLR5501",
    "PLR2004",
    "PLR0912",
    "PLR0915",
    ]  # E501: 行过长, PLR0913: 参数过多
select = [
    "E",      # pycodestyle 错误
    "W",      # pycodestyle 警告
    "F",      # pyflakes 检查
    "I",      # isort 导入排序
    "PL",     # pylint 规则 (包含 PLC, PLE, PLR, PLW)
    "D100",   # 公共模块缺少 docstring
    "D101",   # 公共类缺少 docstring
    "D102",   # 公共方法缺少 docstring
    "D103",   # 公共函数缺少 docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"
