name: RWA

compile:
  output_extra:
    - ABI

# 插件配置
plugins:
  - name: vyper

# 编译器配置
vyper:
  version: 0.4.0
  evm_version: paris

# 网络配置
ethereum:
  # Sepolia测试网
  sepolia:
    default_provider: alchemy

  # 主网（生产环境）
  mainnet:
    default_provider: alchemy

# 自定义网络配置
networks:
  custom:
    - name: hardhat
      chain_id: 31337
      ecosystem: ethereum
      default_provider: node

# Node provider 配置（连接远程 Hardhat 节点）
node:
  ethereum:
    hardhat:
      uri: http://127.0.0.1:8545
# 测试配置（与 Hardhat 一致）
test:
  mnemonic: test test test test test test test test test test test junk # 助记词
  hd_path: m/44'/60'/0'/0 # HD 钱包派生路径
  number_of_accounts: 20 # 生成 20 个账户
  balance: 10000 ether # 每个账户 10000 ETH

# 依赖（如果需要）
dependencies:
  - name: openzeppelin
    github: OpenZeppelin/openzeppelin-contracts
    version: 4.9.0
