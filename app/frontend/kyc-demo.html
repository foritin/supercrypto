<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC认证 - MetaMask Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .wallet-section {
            background: #f7f9fc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .wallet-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .wallet-address {
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            word-break: break-all;
            border: 2px solid #e0e0e0;
        }
        
        .wallet-address.empty {
            color: #999;
            font-family: inherit;
        }
        
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .form-section {
            display: none;
            margin-top: 30px;
        }
        
        .form-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .network-info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 KYC 认证系统</h1>
        <p class="subtitle">请连接您的MetaMask钱包并完成身份认证</p>
        
        <div id="alert" class="alert"></div>
        
        <!-- 钱包连接部分 -->
        <div class="wallet-section">
            <div class="wallet-status">
                <span style="font-weight: 600; color: #333;">钱包状态</span>
                <span id="status-badge" class="status-badge disconnected">未连接</span>
            </div>
            
            <div class="wallet-address empty" id="wallet-address">
                请先连接钱包
            </div>
            
            <div class="network-info" id="network-info"></div>
            
            <button class="btn-primary" id="connect-btn" onclick="connectWallet()">
                连接 MetaMask
            </button>
            
            <button class="btn-secondary" id="disconnect-btn" onclick="disconnectWallet()" style="display: none;">
                断开连接
            </button>
        </div>
        
        <!-- KYC表单部分 -->
        <div class="form-section" id="kyc-form">
            <h2 style="margin-bottom: 20px; color: #333; font-size: 20px;">📝 填写认证信息</h2>
            
            <form onsubmit="submitKYC(event)">
                <div class="form-group">
                    <label for="name">真实姓名 *</label>
                    <input type="text" id="name" required placeholder="请输入您的真实姓名">
                </div>
                
                <div class="form-group">
                    <label for="idCard">身份证号 *</label>
                    <input type="text" id="idCard" required placeholder="请输入身份证号">
                </div>
                
                <div class="form-group">
                    <label for="phone">手机号码 *</label>
                    <input type="tel" id="phone" required placeholder="请输入手机号码">
                </div>
                
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" placeholder="请输入电子邮箱（可选）">
                </div>
                
                <div class="form-group">
                    <label for="address">联系地址</label>
                    <textarea id="address" placeholder="请输入详细地址（可选）"></textarea>
                </div>
                
                <button type="submit" class="btn-primary">
                    提交认证信息
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentAccount = null;
        let chainId = null;

        // 检查MetaMask是否安装
        function checkMetaMask() {
            if (typeof window.ethereum === 'undefined') {
                showAlert('请先安装 MetaMask 浏览器插件！', 'error');
                return false;
            }
            return true;
        }

        // 连接钱包
        async function connectWallet() {
            if (!checkMetaMask()) return;

            try {
                showAlert('正在连接 MetaMask...', 'info');
                
                // 请求账户访问
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                currentAccount = accounts[0];
                
                // 获取网络信息
                chainId = await window.ethereum.request({ method: 'eth_chainId' });
                
                // 更新UI
                updateWalletUI(true);
                showAlert('✅ 钱包连接成功！', 'success');
                
                console.log('已连接钱包:', currentAccount);
                console.log('网络 ID:', chainId);
                
            } catch (error) {
                console.error('连接失败:', error);
                showAlert('连接失败: ' + error.message, 'error');
            }
        }

        // 断开连接
        function disconnectWallet() {
            currentAccount = null;
            chainId = null;
            updateWalletUI(false);
            showAlert('已断开钱包连接', 'info');
        }

        // 更新钱包UI
        function updateWalletUI(connected) {
            const statusBadge = document.getElementById('status-badge');
            const walletAddress = document.getElementById('wallet-address');
            const connectBtn = document.getElementById('connect-btn');
            const disconnectBtn = document.getElementById('disconnect-btn');
            const kycForm = document.getElementById('kyc-form');
            const networkInfo = document.getElementById('network-info');
            
            if (connected) {
                statusBadge.className = 'status-badge connected';
                statusBadge.textContent = '已连接';
                
                walletAddress.className = 'wallet-address';
                walletAddress.textContent = currentAccount;
                
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'block';
                
                kycForm.classList.add('active');
                
                // 显示网络信息
                const networkName = getNetworkName(chainId);
                networkInfo.textContent = `当前网络: ${networkName}`;
                
            } else {
                statusBadge.className = 'status-badge disconnected';
                statusBadge.textContent = '未连接';
                
                walletAddress.className = 'wallet-address empty';
                walletAddress.textContent = '请先连接钱包';
                
                connectBtn.style.display = 'block';
                disconnectBtn.style.display = 'none';
                
                kycForm.classList.remove('active');
                
                networkInfo.textContent = '';
            }
        }

        // 获取网络名称
        function getNetworkName(chainId) {
            const networks = {
                '0x1': 'Ethereum 主网',
                '0x5': 'Goerli 测试网',
                '0xaa36a7': 'Sepolia 测试网',
                '0x7a69': 'Hardhat 本地网络 (31337)'
            };
            return networks[chainId] || `未知网络 (${chainId})`;
        }

        // 提交KYC信息
        async function submitKYC(event) {
            event.preventDefault();
            
            if (!currentAccount) {
                showAlert('请先连接钱包！', 'error');
                return;
            }
            
            // 收集表单数据
            const kycData = {
                walletAddress: currentAccount,
                chainId: chainId,
                name: document.getElementById('name').value,
                idCard: document.getElementById('idCard').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                timestamp: new Date().toISOString()
            };
            
            console.log('提交的KYC数据:', kycData);
            
            // 模拟API调用
            try {
                showAlert('正在提交认证信息...', 'info');
                
                // TODO: 实际项目中替换为真实的API调用
                // await fetch('/api/kyc/submit', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify(kycData)
                // });
                
                // 模拟延迟
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                showAlert('✅ 认证信息提交成功！请等待审核。', 'success');
                
                // 清空表单
                event.target.reset();
                
                // 在控制台显示完整数据
                console.log('='.repeat(60));
                console.log('KYC提交成功！');
                console.log('钱包地址:', kycData.walletAddress);
                console.log('完整数据:', JSON.stringify(kycData, null, 2));
                console.log('='.repeat(60));
                
            } catch (error) {
                console.error('提交失败:', error);
                showAlert('提交失败: ' + error.message, 'error');
            }
        }

        // 显示提示消息
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // 监听账户变化
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    disconnectWallet();
                    showAlert('账户已断开', 'info');
                } else if (accounts[0] !== currentAccount) {
                    currentAccount = accounts[0];
                    updateWalletUI(true);
                    showAlert('账户已切换', 'info');
                }
            });

            // 监听网络变化
            window.ethereum.on('chainChanged', (newChainId) => {
                chainId = newChainId;
                if (currentAccount) {
                    updateWalletUI(true);
                    showAlert('网络已切换到: ' + getNetworkName(chainId), 'info');
                }
            });
        }

        // 页面加载时检查是否已连接
        window.addEventListener('load', async () => {
            if (checkMetaMask()) {
                try {
                    const accounts = await window.ethereum.request({ 
                        method: 'eth_accounts' 
                    });
                    if (accounts.length > 0) {
                        currentAccount = accounts[0];
                        chainId = await window.ethereum.request({ method: 'eth_chainId' });
                        updateWalletUI(true);
                    }
                } catch (error) {
                    console.error('检查连接状态失败:', error);
                }
            }
        });
    </script>
</body>
</html>
