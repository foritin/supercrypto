# deploy_manifest.toml — Rust 后端合约部署清单
# 启动时自动检查并导入/部署这些合约，支持去重。
#
# 字段说明:
#   name            - 合约名称（与 .build/abi/{name}.json 对应）
#   contract_type   - 功能类型: registry, kyc, governance, stablecoin, token, defi
#   scope           - 作用域: global (公共合约) / project (项目专属)
#   project_name    - 所属项目: common / vanke
#   provider_key    - AddressProvider 中的 key 名称
#   is_primary      - 是否为项目主合约
#   deploy_order    - 部署顺序 (越小越先)
#   dependencies    - 依赖的其他合约名 (JSON 数组字符串)
#   description     - 描述
#
# 去重策略:
#   1. 优先查 DB (contract_deployment 表，按 contract_name + network)
#   2. 其次查 Python 部署输出 JSON (output/deployed_*.json)
#   3. 如果都没找到，记录 WARNING 等待手动通过 /admin/contracts/deploy 部署

[[contracts]]
name = "AddressProvider"
contract_type = "registry"
scope = "global"
project_name = "common"
provider_key = "ADDRESS_PROVIDER"
is_primary = true
deploy_order = 0
dependencies = "[]"
description = "地址提供者合约 - 所有合约地址的注册中心"

