[package]
name = "backend"
version = "1.0.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1.45", features = ["full"] }

# Web 框架
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 配置
config = "0.15"
toml = "0.8"

# 数据库：SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "json", "bigdecimal"] }

# 数字精度
rust_decimal = { version = "1", features = ["serde-str"] }

# Redis
deadpool-redis = "0.20"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

# JWT
jsonwebtoken = "9"

# 密码学
ring = "0.17"
http = "1"
alloy = { version = "2.1", features = ["providers", "signer-local", "sol-types", "contract", "rpc-types-eth", "network"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 验证
validator = { version = "0.20", features = ["derive"] }

# 定时任务
tokio-cron-scheduler = "0.14"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

# 工具
anyhow = "1"
thiserror = "2"
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
reqwest = "0.12"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
