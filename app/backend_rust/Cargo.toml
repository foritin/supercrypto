[package]
name = "backend"
version = "1.0.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1.45", features = ["full"] }

# Web 框架
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 配置
config = "0.15"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "decimal"] }

# 数字精度
rust_decimal = { version = "1", features = ["db-postgres", "serde-str"] }

# Redis
deadpool-redis = "0.20"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

# JWT
jsonwebtoken = "9"

# Web3
alloy = { version = "0.15", features = ["full"] }

# 密码学
ring = "0.17"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 验证
validator = { version = "0.20", features = ["derive"] }

# 上传
multer = "3"

# S3 / MinIO
aws-sdk-s3 = "1"
aws-config = "1"

# 定时任务
tokio-cron-scheduler = "0.14"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

# 工具
anyhow = "1"
thiserror = "2"
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
reqwest = "0.12"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
